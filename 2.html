<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive Batch Upvote Tool</title>

<script src="https://cdn.jsdelivr.net/npm/@hiveio/hive-js/dist/hive.min.js"></script>
<script>
  hive.api.setOptions({ url: 'https://api.hive.blog' });
  hive.config.set('address_prefix','STM');
  hive.config.set('chain_id','beeab0de00000000000000000000000000000000000000000000000000000000');
</script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:16px;
}
.container{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
h2{
  text-align:center;
}
label{
  font-size:14px;
  font-weight:bold;
  display:block;
  margin-top:12px;
}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:14px;
  margin-top:16px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:6px;
  background:#4CAF50;
  color:#fff;
  cursor:pointer;
}
button.secondary{
  background:#2196F3;
}
button.danger{
  background:#f44336;
}
.account{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding:6px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}
.status{
  font-size:12px;
}
.note{
  font-size:12px;
  color:#555;
  margin-top:12px;
  text-align:center;
}
</style>
</head>

<body>
<div class="container">

<h2>Hive Batch Upvote Tool</h2>

<!-- ADD ACCOUNT -->
<label>Username</label>
<input id="newUser" placeholder="username">

<label>Posting Private Key</label>
<input id="newKey" type="password" placeholder="5K...">

<button class="secondary" onclick="addAccount()">Tambah Akun</button>

<!-- ACCOUNT LIST -->
<h3>Akun Tersimpan</h3>
<div id="accountList"></div>

<button class="danger" onclick="clearAccounts()">Hapus Semua Akun</button>

<hr>

<!-- VOTE -->
<label>Link Post Hive</label>
<input id="postLink" placeholder="https://ecency.com/@author/permlink">

<button onclick="startBatchVote()">Vote dengan Semua Akun</button>

<div class="note">
Posting key & username disimpan lokal di browser ini.
</div>

</div>

<script>
let accounts = JSON.parse(localStorage.getItem("hive_accounts")) || [];

function saveAccounts(){
  localStorage.setItem("hive_accounts", JSON.stringify(accounts));
}

function renderAccounts(){
  const list = document.getElementById("accountList");
  list.innerHTML = "";
  accounts.forEach((acc, i) => {
    const div = document.createElement("div");
    div.className = "account";
    div.innerHTML = `
      <label>
        <input type="checkbox" ${acc.enabled ? "checked" : ""} onchange="toggleAccount(${i})">
        @${acc.username}
      </label>
      <span class="status" id="status-${i}">Idle</span>
    `;
    list.appendChild(div);
  });
}

function addAccount(){
  const u = document.getElementById("newUser").value.trim();
  const k = document.getElementById("newKey").value.trim();
  if(!u || !k) return;

  accounts.push({username:u, postingKey:k, enabled:true});
  saveAccounts();
  renderAccounts();

  document.getElementById("newUser").value="";
  document.getElementById("newKey").value="";
}

function toggleAccount(i){
  accounts[i].enabled = !accounts[i].enabled;
  saveAccounts();
}

function clearAccounts(){
  accounts = [];
  saveAccounts();
  renderAccounts();
}

function updateStatus(i,text){
  const el = document.getElementById("status-"+i);
  if(el) el.textContent = text;
}

async function startBatchVote(){
  const link = document.getElementById("postLink").value.trim();
  const p = link.split("/");
  if(p.length < 6) return;

  const author = p[4].replace("@","");
  const permlink = p[5];

  for(let i=0;i<accounts.length;i++){
    const acc = accounts[i];
    if(!acc.enabled) continue;

    updateStatus(i,"broadcasting… ⏳");

    await new Promise(resolve=>{
      hive.broadcast.vote(
        acc.postingKey,
        acc.username,
        author,
        permlink,
        10000,
        (err)=>{
          updateStatus(i, err ? "failed ❌" : "success ✅");
          resolve();
        }
      );
    });
  }
}

renderAccounts();
</script>

</body>
</html>
