<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Hive Batch Upvote Tool</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f4f4;
}

.container {
  max-width: 480px;
  margin: auto;
  background: #fff;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

/* ===== HEADER ===== */
h2 {
  text-align: center;
  margin: 0 0 14px;
}

/* ===== TOOLS BAR ===== */
.tools-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.tool-btn {
  flex: 1;
  padding: 12px 0;
  font-size: 16px;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.export {
  background: #e3f2fd;
  color: #1565c0;
}

.import {
  background: #e8f5e9;
  color: #2e7d32;
}

/* ===== INPUTS ===== */
label {
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  display: block;
}

input[type=text],
input[type=password] {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  font-size: 16px; /* prevent zoom */
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* ===== ADD ACCOUNT ===== */
.add-btn {
  margin-top: 14px;
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 10px;
  border: none;
  background: #4caf50;
  color: #fff;
  cursor: pointer;
}

/* ===== ACCOUNT LIST ===== */
.account-list {
  margin-top: 18px;
}

.account {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  background: #f7f7f7;
}

.account input[type=checkbox] {
  transform: scale(1.2);
}

.account-name {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  word-break: break-all;
}

.status {
  font-size: 12px;
  color: #777;
}

/* ===== VOTE ===== */
.vote-btn {
  margin-top: 18px;
  width: 100%;
  padding: 16px;
  font-size: 17px;
  font-weight: 800;
  border-radius: 12px;
  border: none;
  background: #ff5722;
  color: white;
  cursor: pointer;
}

/* ===== NOTE ===== */
.note {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Hive Batch Upvote</h2>

  <!-- TOOLS -->
  <div class="tools-bar">
    <button class="tool-btn export" onclick="exportAccounts()">Export</button>
    <button class="tool-btn import" onclick="document.getElementById('importFile').click()">Import</button>
    <input type="file" id="importFile" hidden onchange="importAccounts(event)">
  </div>

  <!-- ADD ACCOUNT -->
  <label>Username</label>
  <input type="text" id="username" placeholder="username">

  <label>Posting Private Key</label>
  <input type="password" id="postingKey" placeholder="5K...">

  <button class="add-btn" onclick="addAccount()">Tambah Akun</button>

  <!-- ACCOUNT LIST -->
  <div class="account-list" id="accountList"></div>

  <!-- POST LINK -->
  <label>Link Post Hive</label>
  <input type="text" id="postLink" placeholder="https://ecency.com/@author/permlink">

  <!-- VOTE -->
  <button class="vote-btn" onclick="voteAll()">Vote Semua Akun</button>

  <div class="note">
    Data disimpan lokal di browser Anda
  </div>
</div>

<script>
let accounts = JSON.parse(localStorage.getItem('hive_accounts') || '[]');

function save() {
  localStorage.setItem('hive_accounts', JSON.stringify(accounts));
}

function render() {
  const list = document.getElementById('accountList');
  list.innerHTML = '';
  accounts.forEach((a, i) => {
    list.innerHTML += `
      <div class="account">
        <input type="checkbox" checked>
        <div class="account-name">@${a.username}</div>
        <div class="status">ready</div>
      </div>`;
  });
}

function addAccount() {
  const u = username.value.trim();
  const k = postingKey.value.trim();
  if (!u || !k) return;

  accounts.push({ username: u, key: k });
  save();
  render();
  username.value = '';
  postingKey.value = '';
}

function exportAccounts() {
  const blob = new Blob([JSON.stringify(accounts)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hive-accounts.json';
  a.click();
}

function importAccounts(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    accounts = JSON.parse(r.result);
    save();
    render();
  };
  r.readAsText(file);
}

function voteAll() {
  alert("Logic vote Hive sambungkan di sini 🚀");
}

render();
</script>

</body>
</html>
