<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive Upvote Tool</title>

<script src="https://cdn.jsdelivr.net/npm/@hiveio/hive-js/dist/hive.min.js"></script>

<script>
  hive.api.setOptions({ url: 'https://api.hive.blog' });
  hive.config.set('address_prefix','STM');
  hive.config.set('chain_id','beeab0de00000000000000000000000000000000000000000000000000000000');
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 16px;
  }

  .container {
    max-width: 480px;
    margin: auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  label {
    font-size: 14px;
    font-weight: bold;
    display: block;
    margin-top: 12px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #43a047;
  }

  .note {
    font-size: 12px;
    color: #555;
    margin-top: 15px;
    text-align: center;
  }
</style>
</head>

<body>

<div class="container">
  <h2>Hive Upvote Tool</h2>

  <label>Username</label>
  <input type="text" id="username" placeholder="username">

  <label>Posting Private Key</label>
  <input type="password" id="postingKey" placeholder="5K...">

  <label>Link Post Hive</label>
  <input type="text" id="postLink" placeholder="https://ecency.com/@author/permlink">

  <button onclick="doVote()">Upvote 100%</button>

  <div class="note">
    Data username & key disimpan di browser (local).
  </div>
</div>

<script>
  // Load saved data
  document.getElementById('username').value = localStorage.getItem('hive_username') || '';
  document.getElementById('postingKey').value = localStorage.getItem('hive_posting_key') || '';

  function doVote(){
    const username = document.getElementById('username').value.trim();
    const postingKey = document.getElementById('postingKey').value.trim();
    const link = document.getElementById('postLink').value.trim();

    if(!username || !postingKey || !link){
      alert("Semua kolom wajib diisi");
      return;
    }

    // Save to localStorage
    localStorage.setItem('hive_username', username);
    localStorage.setItem('hive_posting_key', postingKey);

    // Parse link
    const parts = link.split('/');
    if(parts.length < 6){
      alert("Link Hive tidak valid");
      return;
    }

    const author = parts[4].replace('@','');
    const permlink = parts[5];

    hive.broadcast.vote(
      postingKey,
      username,
      author,
      permlink,
      10000, // 100%
      function(err, result){
        console.log(err, result);
        if(err){
          alert("Gagal: " + JSON.stringify(err));
        } else {
          alert("Upvote berhasil!");
        }
      }
    );
  }
</script>

</body>
</html>
