<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hive Multi Voter</title>

<script src="https://cdn.jsdelivr.net/npm/@hiveio/hive-js/dist/hive.min.js"></script>

<script>
  hive.api.setOptions({ url: 'https://api.hive.blog' });
  hive.config.set('address_prefix','STM');
  hive.config.set('chain_id','beeab0de00000000000000000000000000000000000000000000000000000000');
</script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:16px;
  background:#f3f4f6;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  color:#333;
}

.container{
  max-width:480px;
  margin:auto;
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

h2{
  text-align:center;
  margin:0 0 16px;
}

.section{
  margin-top:18px;
}

.section-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  font-size:16px; /* penting: cegah auto zoom */
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:14px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:#fff;
  cursor:pointer;
}

button.secondary{
  background:#3b82f6;
}

button.danger{
  background:#ef4444;
}

button:active{
  transform:scale(.98);
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
}

.account small{
  font-size:12px;
  color:#555;
}

.status{
  font-size:12px;
  text-align:center;
  margin-top:10px;
  color:#555;
}

.progress{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:width .3s;
}
</style>
</head>

<body>

<div class="container">

<h2>Hive Multi Voter</h2>

<div class="section">
  <div class="section-title">Tambah Akun</div>
  <input id="username" placeholder="username">
  <input id="postingKey" type="password" placeholder="posting private key">
  <button class="secondary" onclick="addAccount()">Tambah Akun</button>
</div>

<div class="section">
  <div class="section-title">Daftar Akun</div>
  <div id="accounts"></div>
</div>

<div class="section">
  <div class="section-title">Link Post</div>
  <input id="postLink" placeholder="https://ecency.com/@author/permlink">
  <button onclick="voteAll()">Upvote Semua</button>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="status" class="status"></div>
</div>

</div>

<script>
let accounts = JSON.parse(localStorage.getItem('hive_accounts')||'[]');

function save(){
  localStorage.setItem('hive_accounts',JSON.stringify(accounts));
}

function render(){
  const el=document.getElementById('accounts');
  el.innerHTML='';
  accounts.forEach((a,i)=>{
    el.innerHTML+=`
      <div class="account">
        <input type="checkbox" checked>
        <div>
          <b>@${a.username}</b><br>
          <small>${a.status||'idle'}</small>
        </div>
      </div>`;
  });
}
render();

function addAccount(){
  const u=username.value.trim();
  const k=postingKey.value.trim();
  if(!u||!k)return;
  accounts.push({username:u,key:k,status:'idle'});
  save();
  render();
  username.value='';
  postingKey.value='';
}

function voteAll(){
  const link=postLink.value.trim();
  const p=link.split('/');
  if(p.length<6)return;

  const author=p[4].replace('@','');
  const permlink=p[5];

  let i=0;
  document.getElementById('status').innerText='broadcasting...';

  function next(){
    if(i>=accounts.length){
      document.getElementById('status').innerText='success';
      return;
    }
    hive.broadcast.vote(
      accounts[i].key,
      accounts[i].username,
      author,
      permlink,
      10000,
      ()=>{
        i++;
        document.getElementById('progressBar').style.width =
          Math.round(i/accounts.length*100)+'%';
        setTimeout(next,1500);
      }
    );
  }
  next();
}
</script>

</body>
</html>
