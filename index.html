<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive Upvote Tool</title>

<script src="https://cdn.jsdelivr.net/npm/@hiveio/hive-js/dist/hive.min.js"></script>

<script>
  hive.api.setOptions({ url: 'https://api.hive.blog' });
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    padding: 15px;
  }

  .box {
    max-width: 420px;
    margin: auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #e53935;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:active {
    opacity: 0.8;
  }

  .status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
  }

  .loading { color: #ff9800; }
  .success { color: #2e7d32; }
  .error   { color: #c62828; }
</style>
</head>

<body>

<div class="box">
  <h2>Hive Upvote</h2>

  <input id="username" type="text" placeholder="Username">
  <input id="postingKey" type="password" placeholder="Posting Key">
  <input id="postLink" type="text" placeholder="Link Post Hive">

  <button onclick="upvote()">Upvote</button>

  <div id="status" class="status"></div>
</div>

<script>
  // Load saved data
  document.getElementById('username').value = localStorage.getItem('hive_user') || '';
  document.getElementById('postingKey').value = localStorage.getItem('hive_key') || '';

  function setStatus(text, cls) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status ' + cls;
  }

  function upvote() {
    const voter = document.getElementById('username').value.trim();
    const wif   = document.getElementById('postingKey').value.trim();
    const link  = document.getElementById('postLink').value.trim();

    if (!voter || !wif || !link) {
      setStatus('Semua kolom wajib diisi', 'error');
      return;
    }

    // Save locally
    localStorage.setItem('hive_user', voter);
    localStorage.setItem('hive_key', wif);

    // Parse link
    const parts = link.split('/');
    if (parts.length < 6) {
      setStatus('Link Hive tidak valid', 'error');
      return;
    }

    const author = parts[4].replace('@', '');
    const permlink = parts[5];

    setStatus('broadcasting...', 'loading');

    hive.broadcast.vote(
      wif,
      voter,
      author,
      permlink,
      10000, // 100%
      function (err, result) {
        if (err) {
          setStatus('failed: ' + err.message, 'error');
        } else {
          setStatus('success ✓ upvote sent', 'success');
        }
      }
    );
  }
</script>

</body>
</html>
